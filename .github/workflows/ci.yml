name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package macOS x86_64
        if: github.event_name == 'release'
        run: |
          cd target/x86_64-apple-darwin/release
          ARCHIVE="proxypass-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz"
          tar czf "$ARCHIVE" proxypass
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Package macOS arm64
        if: github.event_name == 'release'
        run: |
          cd target/aarch64-apple-darwin/release
          ARCHIVE="proxypass-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz"
          tar czf "$ARCHIVE" proxypass
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload macOS x86_64
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: macos-x86_64
          path: target/x86_64-apple-darwin/release/proxypass-*.tar.gz*

      - name: Upload macOS arm64
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: macos-arm64
          path: target/aarch64-apple-darwin/release/proxypass-*.tar.gz*

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Build
        run: cargo build --release

      - name: Package Linux
        if: github.event_name == 'release'
        run: |
          cd target/release
          ARCHIVE="proxypass-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz"
          tar czf "$ARCHIVE" proxypass
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload Linux
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: linux-x86_64
          path: target/release/proxypass-*.tar.gz*

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --no-default-features

      - name: Package Windows (PowerShell)
        if: github.event_name == 'release'
        run: |
          $ARCHIVE="proxypass-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path target\release\proxypass.exe -DestinationPath "target\release\$ARCHIVE"
          $hash = (Get-FileHash "target\release\$ARCHIVE" -Algorithm SHA256).Hash
          "$hash  $ARCHIVE" | Out-File "target\release\$ARCHIVE.sha256"

      - name: Upload Windows
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: windows-x86_64
          path: target/release/proxypass-*.zip*

  publish-release:
    name: Publish Release Assets
    if: github.event_name == 'release'
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Upload to release
        run: |
          cd artifacts
          for f in */*.tar.gz */*.zip; do
            [ -f "$f" ] && gh release upload "${{ github.ref_name }}" "$f" --repo "${{ github.repository }}"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Homebrew formula SHAs
        run: |
          VERSION="${{ github.ref_name }}"
          FORMULA_VERSION="${VERSION#v}"

          ARM64_SHA=$(shasum -a 256 artifacts/macos-arm64/proxypass-${VERSION}-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          X86_SHA=$(shasum -a 256 artifacts/macos-x86_64/proxypass-${VERSION}-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          LINUX_SHA=$(shasum -a 256 artifacts/linux-x86_64/proxypass-${VERSION}-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)

          awk -v ver="${FORMULA_VERSION}" -v arm="${ARM64_SHA}" -v x86="${X86_SHA}" -v linux="${LINUX_SHA}" '
            /^  version / { printf "  version \"%s\"\n", ver; next }
            /^      sha256 / {
              if (n++ == 0) { printf "      sha256 \"%s\"\n", arm; next }
              if (n == 2)  { printf "      sha256 \"%s\"\n", x86; next }
              if (n == 3)  { printf "      sha256 \"%s\"\n", linux; next }
            }
            { print }
          ' Formula/proxypass.rb > Formula/proxypass.rb.tmp && mv Formula/proxypass.rb.tmp Formula/proxypass.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/proxypass.rb
          git commit -m "chore(formula): update SHAs for ${VERSION}" || true
          git push origin main
