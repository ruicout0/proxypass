[package]
name = "proxypass"
version = "0.1.0"
edition = "2021"
description = "A lightweight PAC-aware HTTP proxy with OS keychain auth and simple CLI"
license = "MIT"
repository = "https://github.com/rui/proxypass"

[[bin]]
name = "proxypass"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP proxy engine
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# TLS
rustls = "0.23"
tokio-rustls = "0.26"
rustls-native-certs = "0.7"
webpki-roots = "0.26"

# PAC evaluation (QuickJS)
rquickjs = { version = "0.6", features = ["full"] }

# Auth
libgssapi = { version = "0.7", features = ["krb5_bindgen"] }

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# Keychain
keyring = { version = "3", features = ["apple-native"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
chrono = "0.4"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
tokio-io-timeout = "1"
bytes = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
rpassword = "7"
libc = "0.2"
